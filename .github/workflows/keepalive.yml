name: Supabase keepalive

# Supabase ücretsiz projeleri 1 hafta hareketsizlikte duraklar; haftalık bir okuma isteği bunu önler.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          url=$(sed -n 's/.*SUPABASE_URL: *"\([^"]*\)".*/\1/p' js/config.js)
          key=$(sed -n 's/.*SUPABASE_ANON_KEY: *"\([^"]*\)".*/\1/p' js/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "config.js boş, atlanıyor"; exit 0; fi
          curl -fsS "$url/rest/v1/places?select=id&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key" >/dev/null
          echo "ok"
